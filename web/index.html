<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Venu — bandingkan dan booking lapangan futsal, badminton, dan basket." />
    <meta name="color-scheme" content="light dark" />
    <title>Venu — Booking Lapangan Olahraga</title>
    <script>
      // Pasang tema sebelum halaman digambar agar tidak berkedip (lihat src/theme/).
      (function () {
        var saved = localStorage.getItem('venu.theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      /* Splash pembuka: tampil hanya saat halaman pertama kali dimuat, lalu dihapus. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #fbfaf7;
        transition: opacity 250ms ease-out;
      }
      [data-theme='dark'] #splash {
        background: #151412;
      }
      #splash.is-done {
        opacity: 0;
      }
      #splash canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><canvas></canvas></div>
    <div id="root"></div>
    <script>
      /**
       * Splash "matrix" (~1 detik): efeknya hanya di dalam teks, latar tetap polos. Di setiap posisi
       * huruf, karakter berwarna aksen terus berganti dengan jejak samar yang turun ke posisinya
       * (satu kolom matrix kecil per huruf), lalu huruf terkunci satu per satu membentuk "venu.".
       * Splash baru hilang setelah animasi selesai DAN aplikasi React sudah tampil.
       * Hormati prefers-reduced-motion: langsung tampilkan kata tanpa animasi.
       */
      (function () {
        var splash = document.getElementById('splash');
        var ctx = splash.querySelector('canvas').getContext('2d');
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var COLORS = dark ? { fg: '#EEEAE3', accent: '#86C7A1' } : { fg: '#1D1B17', accent: '#1F6B45' };
        // Huruf kecil & angka: lebarnya mirip huruf asli, jadi karakter acak tidak saling menimpa.
        var GLYPHS = 'abcdeghknopqrsuvxyz0123456789';
        var NARROW_GLYPHS = ':;,|!'; // untuk slot titik
        var WORD = 'venu.';
        var LOCK_START = 250; // huruf pertama terkunci
        var LOCK_STEP = 110; // jeda antarhuruf
        var HOLD = 350; // kata utuh ditahan sebentar sebelum memudar
        var DURATION = LOCK_START + (WORD.length - 1) * LOCK_STEP + HOLD;
        var TICK = 55; // karakter berganti tiap 55 ms
        var TRAIL = 2; // jumlah karakter samar di atas tiap huruf
        var TRAIL_FADE = 180; // jejak memudar setelah huruf terkunci
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        var dpr = window.devicePixelRatio || 1;
        var width = window.innerWidth;
        var height = window.innerHeight;
        ctx.canvas.width = width * dpr;
        ctx.canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        var size = Math.min(96, Math.max(56, width * 0.14));
        var step = size * 0.8; // jarak vertikal antarkarakter di kolom
        ctx.font = '800 ' + size + 'px "Plus Jakarta Sans", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Posisi tiap huruf dihitung dari kata akhirnya, jadi karakter acak tidak menggeser tata letak.
        var widths = WORD.split('').map(function (letter) {
          return ctx.measureText(letter).width;
        });
        var total = widths.reduce(function (a, b) {
          return a + b;
        }, 0);
        var centers = [];
        var x = (width - total) / 2;
        widths.forEach(function (w) {
          centers.push(x + w / 2);
          x += w;
        });

        function glyph(slot, seed, tick) {
          var set = WORD.charAt(slot) === '.' ? NARROW_GLYPHS : GLYPHS;
          var n = Math.sin(seed * 127.1 + tick * 311.7 + slot * 74.7) * 43758.5453;
          return set.charAt(Math.floor((n - Math.floor(n)) * set.length));
        }

        /** Karakter acak dipaskan ke lebar slot hurufnya (dipersempit bila lebih lebar). */
        function fillFitted(text, slot, y) {
          var scale = Math.min(1, widths[slot] / ctx.measureText(text).width);
          ctx.save();
          ctx.translate(centers[slot], y);
          ctx.scale(scale, 1);
          ctx.fillText(text, 0, 0);
          ctx.restore();
        }

        function draw(elapsed) {
          ctx.clearRect(0, 0, width, height);
          var tick = Math.floor(elapsed / TICK);
          var fall = (elapsed % TICK) / TICK; // jejak bergeser turun di antara pergantian karakter
          var y = height / 2;
          for (var i = 0; i < WORD.length; i++) {
            var lockAt = LOCK_START + i * LOCK_STEP;
            var locked = elapsed >= lockAt;
            var trailAlpha = locked ? Math.max(0, 1 - (elapsed - lockAt) / TRAIL_FADE) : 1;
            ctx.fillStyle = COLORS.accent;
            for (var k = 1; k <= TRAIL && trailAlpha > 0; k++) {
              ctx.globalAlpha = trailAlpha * 0.3 * (1 - k / (TRAIL + 1));
              fillFitted(glyph(i, i * 7 + k, tick), i, y - (k - fall) * step);
            }
            ctx.globalAlpha = 1;
            var letter = WORD.charAt(i);
            ctx.fillStyle = locked && letter !== '.' ? COLORS.fg : COLORS.accent;
            if (locked) ctx.fillText(letter, centers[i], y);
            else fillFitted(glyph(i, i * 7, tick), i, y);
          }
        }

        var started = performance.now();
        var animationDone = reduced;

        function frame(now) {
          var elapsed = now - started;
          draw(elapsed);
          if (elapsed < DURATION) {
            requestAnimationFrame(frame);
          } else {
            animationDone = true;
            finishWhenReady();
          }
        }

        function appIsVisible() {
          return document.getElementById('root').childElementCount > 0;
        }

        function finishWhenReady() {
          if (!animationDone) return;
          if (!appIsVisible()) {
            setTimeout(finishWhenReady, 50);
            return;
          }
          splash.classList.add('is-done');
          setTimeout(function () {
            splash.remove();
          }, 260);
        }

        if (reduced) {
          draw(Infinity);
          finishWhenReady();
        } else {
          requestAnimationFrame(frame);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
